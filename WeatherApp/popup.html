<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yr Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <!-- Header: location + refresh -->
    <div class="header">
        <h2 id="location-name">Loading...</h2>
        <span id="location-accuracy" class="accuracy-badge"></span>
        <button id="refresh-btn" class="refresh-btn" title="Refresh location">↻</button>
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="loading" style="display:none">
        <div class="spinner"></div>
    </div>

    <!-- Current conditions -->
    <div class="current-conditions">
        <div class="main-weather">
            <img id="weather-icon" src="icons/01d.png" alt="Weather Icon" width="80" height="80">
            <div class="temp-block">
                <h1 id="temp">--°C</h1>
                <p id="description">Loading...</p>
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-item">
                <span class="detail-label">Wind</span>
                <span class="detail-value" id="wind">-- m/s</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Humidity</span>
                <span class="detail-value" id="humidity">--%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Clouds</span>
                <span class="detail-value" id="clouds">--%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Precip (1h)</span>
                <span class="detail-value" id="precip">-- mm</span>
            </div>
        </div>
    </div>

    <!-- Hourly forecast -->
    <div class="hourly-section">
        <h3>Next 6 Hours</h3>
        <div id="hourly-forecast" class="hourly-forecast">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
